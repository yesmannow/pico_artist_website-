name: Deploy Piko Studio to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  NODE_VERSION: 20
  PROJECT_NAME: pico-artist-portfolio-website

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cloudflare_deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with OpenNext
        run: npm run build:cloudflare
        env:
          NEXT_SKIP_TYPECHECK: 1
          NEXT_SKIP_LINT: 1
          NODE_VERSION: 20.18.0

      - name: Deploy to Cloudflare Pages
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Path last to satisfy Wrangler CLI parsing on Linux runners
          command: pages deploy --project-name=pico-artist-portfolio-website --branch=${{ github.head_ref || github.ref_name }} .open-next/output

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with OpenNext
        run: npm run build:cloudflare
        env:
          NEXT_SKIP_TYPECHECK: 1
          NEXT_SKIP_LINT: 1
          NODE_VERSION: 20.18.0

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Path last to satisfy Wrangler CLI parsing on Linux runners
          command: pages deploy --project-name=pico-artist-portfolio-website --branch=${{ github.head_ref || github.ref_name }} .open-next/output

      - name: Capture preview URL
        id: preview-url
        run: |
          npx wrangler pages deployment list --project-name="${{ env.PROJECT_NAME }}" --branch="${{ github.head_ref || github.ref_name }}" --output json | jq -r '.[0].url' > preview_url.txt
          PREVIEW_URL=$(cat preview_url.txt)
          if [ -z "$PREVIEW_URL" ] || [ "$PREVIEW_URL" = "null" ]; then
            echo "No preview URL found for branch" >&2
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) {
              core.setFailed('Preview URL missing');
            } else {
              const body = `✅ Preview deployment is live:\n\n${url}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }